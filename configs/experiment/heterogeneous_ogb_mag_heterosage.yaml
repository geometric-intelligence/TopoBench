# @package _global_
defaults:
  - override /data_pipeline: heterogeneous_node
  - override /dataset: heterogeneous/OGB_MAG
  - override /model: heterogeneous/heterosage
  - override /logger: heterogeneous_wandb
  - _self_

seed: 0
tags: [heterogeneous, OGB_MAG, neighbor, heterosage, preflight]

optimizer:
  parameters:
    lr: 0.001
    weight_decay: 0.0001

trainer:
  accelerator: auto
  devices: 1
  min_epochs: 1
  max_epochs: 50
  check_val_every_n_epoch: 1
