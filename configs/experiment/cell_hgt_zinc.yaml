# @package _global_
defaults:
  - override /dataset: graph/ZINC
  - override /model: cell/hgt
  - _self_

tags: ["cell", "hgt", "ZINC"]
seed: 0

model:
  feature_encoder:
    out_channels: 64
    proj_dropout: 0.1
  backbone:
    num_layers: 2
    heads: 4
    dropout: 0.1

dataset:
  dataloader_params:
    batch_size: 128

optimizer:
  parameters:
    lr: 0.001
    weight_decay: 0.0001

trainer:
  accelerator: auto
  devices: 1
  min_epochs: 50
  max_epochs: 500
  check_val_every_n_epoch: 5

callbacks:
  early_stopping:
    patience: 10
    min_delta: 0.005
