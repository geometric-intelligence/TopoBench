# @package _global_
defaults:
- override /transforms: GPSE_cell
- data_manipulations@data_transform_4: cell_random_walk_pe

transforms:
  hopse_encoding:
    neighborhoods:
      - 'up_adjacency-0'
      # - 'down_incidence-1'

  graph2cell_lifting:
    neighborhoods: ${transforms.hopse_encoding.neighborhoods}

pe_steps: 8

# Override model backbone 
model:
  backbone:
    pe_steps: ${pe_steps}

# Configure the new transform
data_transform_4:
  pe_steps: ${pe_steps}