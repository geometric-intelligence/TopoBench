# @package _global_
defaults:
  - override /dataset: graph/MUTAG
  - override /model: cell/hgt
  - _self_

tags: ["cell", "hgt", "MUTAG", "debug"]
seed: 0

model:
  feature_encoder:
    out_channels: 32
    proj_dropout: 0.0
  backbone:
    num_layers: 2
    heads: 4
    dropout: 0.0

dataset:
  dataloader_params:
    batch_size: 16

trainer:
  accelerator: cpu
  devices: 1
  min_epochs: 1
  max_epochs: 2
  check_val_every_n_epoch: 1
