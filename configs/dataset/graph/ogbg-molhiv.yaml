
loader:
  _target_: topobench.data.loaders.OGBGDatasetLoader
  parameters:
    data_domain: graph
    data_type: OGBGDataset
    data_name: ogbg-molhiv
    representation_version: molecular-compact-categorical-v1
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}

# Dataset parameters
parameters:
  num_features:
  - 9 # Compact integral OGB atom category columns
  - 3 # Edge features
  num_classes: 2
  task: classification
  loss_type: cross_entropy
  monitor_metric: auroc
  task_level: graph
  feature_policy: categorical_one_hot
  feature_encoding: categorical_one_hot
  stored_num_features: 9
  feature_cardinalities: [119, 5, 12, 12, 10, 6, 6, 2, 2]

#splits
split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_type: "fixed"

# Dataloader parameters
dataloader_params:
  batch_size: 64
  num_workers: 0
  pin_memory: False
