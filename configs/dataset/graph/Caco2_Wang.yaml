# Dataset loader config
loader:
  _target_: topobench.data.loaders.ADMEDatasetLoader
  parameters:
    data_domain: graph
    data_type: ADME
    data_name: Caco2_Wang
    representation_version: molecular-compact-categorical-v1
    split_method: ${dataset.split_params.split_method}
    split_seed: ${dataset.split_params.data_seed}
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}

# Dataset parameters
parameters:
  num_features:
    - 9  # Compact integral OGB atom category columns
    - 3  # OGB edge features
  num_classes: 1  # Regression task
  task: regression
  loss_type: mse
  monitor_metric: mae
  task_level: graph
  feature_policy: categorical_one_hot
  feature_encoding: categorical_one_hot
  stored_num_features: 9
  feature_cardinalities: [119, 5, 12, 12, 10, 6, 6, 2, 2]

# Splits - using fixed scaffold split from TDC
split_params:
  learning_setting: inductive
  data_split_dir: ${paths.data_dir}/data_splits/${dataset.loader.parameters.data_name}
  data_seed: 0
  split_method: scaffold
  split_type: fixed  # TDC provides predefined scaffold splits
  train_prop: 0.5

# Dataloader parameters
dataloader_params:
  batch_size: 64
  num_workers: 0
  pin_memory: False
