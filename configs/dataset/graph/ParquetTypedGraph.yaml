defaults:
  - /callbacks/dataloader_commit@_global_.callbacks
  - /callbacks/input_pipeline@_global_.callbacks
  - _self_

loader:
  _target_: topobench.data.loaders.parquet.ParquetTypedGraphLoader
  parameters:
    data_domain: graph
    data_type: parquet_typed
    data_name: ParquetTypedGraph
    source_root: ${paths.data_dir}/graph/parquet_typed
    output_kind: homogeneous
    node_types:
      paper:
        paths:
          - nodes/paper.parquet
        columns:
          id: paper_id
          id_dtype: int64
          features:
            columns: [feature_0, feature_1]
            dtype: float32
            width: 2
            representation: scalar_columns
    edge_types:
      - type: [paper, cites, paper]
        paths:
          - edges/cites.parquet
        columns:
          source: source_id
          destination: destination_id
          edge_id: edge_id
          fields: [weight]
    supervision:
      target_node_type: paper
      labels:
        source: nodes
        column: label
        dtype: int64
        paths: null
        node_id: null
      splits:
        active: split_01_01_1990
        cross_tag_overlap: allowed
        within_phase_ids: unique
        within_tag_phases: disjoint
        target_id_resolution: required
        sets:
          split_01_01_1990:
            train: splits/train_split_01_01_1990.parquet
            val: splits/val_split_01_01_1990.parquet
            test: splits/test_split_01_01_1990.parquet
            coverage: partial
            qualified: true
    partition:
      strategy: cluster
      backend: pyg
      num_partitions: 1500
      recursive: false
      memory_limit_bytes: 274877906944
      external_partition_map: null
    fitted_transform:
      name: identity
      fit_on: train
      state_path: null
    profiling:
      enabled: true
      sample_every_steps: 10
      emit_on_duration_delta: 0.10
      emit_on_memory_delta_bytes: 268435456
    reproducibility:
      save_reproducibility_bundle: true
    ingestion:
      record_batch_rows: 65536
      memory_limit_bytes: 4294967296
      temp_directory: tmp

parameters:
  task: classification
  task_level: node
  num_features: 2
  num_classes: 2
  target_node_type: paper
  feature_policy: continuous
  loss_type: cross_entropy
  monitor_metric: accuracy

split_params:
  learning_setting: transductive
  split_type: fixed
  source: explicit_registry

dataloader_params:
  clusters_per_batch: 1
  partition_groups: null
  num_workers: 0
  persistent_workers: false
  train_shuffle: true
