loader:
  _target_: topobench.data.loaders.SyntheticHeterogeneousDatasetLoader
  parameters:
    data_domain: heterogeneous
    data_type: synthetic
    data_name: SyntheticHeterogeneous
    data_dir: ${paths.data_dir}/${dataset.loader.parameters.data_domain}/${dataset.loader.parameters.data_type}
    seed: ${seed}

parameters:
  task: classification
  task_level: node
  num_classes: 2
  target_node_type: author
  feature_policy: continuous_with_constant_fill
  loss_type: cross_entropy
  monitor_metric: accuracy

split_params:
  learning_setting: transductive
  split_type: fixed
  source: official_masks

dataloader_params:
  mode: full_batch
  evaluation_protocol: full_graph
  evaluation_seed: ${seed}
  num_workers: 0
  pin_memory: false
  # Applies to training/full loaders; fixed neighbor evaluation forces false.
  persistent_workers: false
