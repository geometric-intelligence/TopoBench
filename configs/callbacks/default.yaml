defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - model_timer
  - best_epoch_metrics
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: ${get_monitor_metric:${dataset.parameters.task},${dataset.parameters.monitor_metric}}
  mode: "${get_monitor_mode:${dataset.parameters.task}}"
  auto_insert_metric_name: False
  save_weights_only: False
  save_top_k: 1
  save_last: False
  #filename: 'epoch{epoch:02d}-val_loss{val/loss:.2f}'

early_stopping:
  monitor: ${get_monitor_metric:${dataset.parameters.task},${dataset.parameters.monitor_metric}}
  patience: 25
  mode: "${get_monitor_mode:${dataset.parameters.task}}"

model_summary:
  max_depth: -1

prediction_artifacts:
  _target_: topobench.callbacks.SelectedCheckpointArtifactCallback
  run_root: ${paths.output_dir}
  root: ${evaluation_artifacts.root}
  shard_rows: ${evaluation_artifacts.shard_rows}
  shard_bytes: ${evaluation_artifacts.shard_bytes}
  metadata_fields: ${evaluation_artifacts.metadata_fields}
  evaluation_slices: ${evaluation_artifacts.evaluation_slices}
  distributed_policy: ${evaluation_artifacts.distributed_policy}
  existing_artifact_policy: ${evaluation_artifacts.existing_artifact_policy}

learning_rate_monitor:
  _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: "epoch"
