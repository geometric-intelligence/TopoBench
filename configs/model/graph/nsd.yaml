_target_: topobench.model.TBModel

model_name: nsd
model_domain: graph

feature_encoder:
  _target_: topobench.nn.encoders.GraphNodeFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}}
  out_channels: 64
  dropout: 0.0
  encoding_mode: ${oc.select:dataset.parameters.feature_encoding,continuous}
  categorical_cardinalities: ${oc.select:dataset.parameters.feature_cardinalities,null}

backbone:
  _target_: topobench.nn.backbones.NSDEncoder
  input_dim: ${model.feature_encoder.out_channels}
  hidden_dim: ${model.feature_encoder.out_channels}
  num_layers: 2
  dropout: 0.4
  sheaf_type: bundle
  d: 4
  input_dropout: 0.0

backbone_wrapper:
  _target_: topobench.nn.wrappers.GNNWrapper
  _partial_: true
  edge_attr_mode: ${validated_edge_attr_mode:${dataset},${model.model_name}}
  edge_weight_mode: ${validated_edge_weight_mode:${dataset},${model.model_name}}

readout:
  _target_: topobench.nn.readouts.MLPReadout
  in_channels: ${model.feature_encoder.out_channels}
  hidden_layers: [16]
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${define_task_level:${dataset.parameters.task_level},${dataset.split_params.learning_setting}}
  pooling_type: sum
  dropout: 0.2
  act: relu
  norm: null
  final_act: null

compile: false
