_target_: topobench.model.TBModel

model_name: edgnn
model_domain: hypergraph

feature_encoder:
  _target_: topobench.nn.encoders.GraphNodeFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}}
  out_channels: 64
  dropout: 0.0

backbone:
  _target_: topobench.nn.backbones.EDGNN
  num_features: ${model.feature_encoder.out_channels}
  input_dropout: 0.2
  dropout: 0.5
  activation: relu
  MLP_num_layers: 1
  All_num_layers: 2
  aggregate: sum

backbone_wrapper:
  _target_: topobench.nn.wrappers.HypergraphWrapper
  _partial_: true

readout:
  _target_: topobench.nn.readouts.MLPReadout
  in_channels: ${model.feature_encoder.out_channels}
  hidden_layers: [64]
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${define_task_level:${dataset.parameters.task_level},${dataset.split_params.learning_setting}}
  pooling_type: sum
  dropout: 0.0
  act: relu
  norm: null
  final_act: null

compile: false
