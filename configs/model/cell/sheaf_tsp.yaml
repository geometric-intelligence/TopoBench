_target_: topobench.model.TBModel

model_name: sheaf_tsp
model_domain: cell

feature_encoder:
  _target_: topobench.nn.encoders.${model.feature_encoder.encoder_name}
  encoder_name: AllCellFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}}
  out_channels: 32
  proj_dropout: 0.0
  selected_dimensions:
    - 0
    - 1

backbone:
  _target_: topobench.nn.backbones.cell.sheaf_tsp.SheafTSP
  in_channels: ${model.feature_encoder.out_channels}
  n_layers: 3
  stalk_dim: 2
  filter_order: 3
  dropout: 0.0
  # Spectral filter basis: "monomial" (raw powers of the normalized
  # Sheaf Laplacian) or "chebyshev" (T_k(L^ - I), better conditioned).
  filter_basis: monomial
  # Transport-alignment regularizer (Tandon et al., Eq. 15).
  # Picked up by TBLoss via configs/loss/default.yaml
  # (modules_losses.backbone) and summed with the task loss.
  loss:
    _target_: topobench.nn.backbones.cell.sheaf_tsp.SheafDirichletLoss
    loss_weight: 0.01

backbone_wrapper:
  _target_: topobench.nn.wrappers.SheafTSPWrapper
  _partial_: true
  wrapper_name: SheafTSPWrapper
  out_channels: ${model.feature_encoder.out_channels}
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}

readout:
  _target_: topobench.nn.readouts.${model.readout.readout_name}
  readout_name: PropagateSignalDown
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}
  hidden_dim: ${model.feature_encoder.out_channels}
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${define_task_level:${dataset.parameters.task_level},${dataset.split_params.learning_setting}}
  pooling_type: sum

compile: false
