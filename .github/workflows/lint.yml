name: Linting

on:
  push:
    branches: [ main, github-actions-test ]
  pull_request:


jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --all-extras

      - name: Run Ruff
        run: uv run --frozen --extra lint ruff check

      - name: Check Ruff formatting
        run: uv run --frozen --extra lint ruff format --check

  pre-commit:
    # Runs the full pre-commit hook stack (numpydoc-validation, end-of-file,
    # trailing-whitespace, etc.) so the bar enforced locally is also enforced
    # in CI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --all-extras

      - name: Run pre-commit
        run: uv run --frozen --extra lint pre-commit run --all-files
