name: Testing

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_qualification:
        description: Run mandatory CUDA and digest-pinned live-data release gates
        required: true
        default: false
        type: boolean


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 1. Setup uv
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 2. Run your centralized installation script
      - name: Install dependencies (via script)
        run: |
          # This script handles the .venv creation and PyTorch/CUDA logic
          source uv_env_setup.sh

      # 3. Verify imports before pytest initializes torch/OpenMP.
      - name: Verify clean pipeline import
        run: |
          source .venv/bin/activate
          python test/data/pipelines/verify_clean_import.py

      # 4. Run Tests
      - name: Test with pytest
        run: |
          # We must activate the venv created by your script
          source .venv/bin/activate
          pytest --cov --cov-report=xml:coverage.xml test/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@e0b68c6749509c5f83f984dd99a76a1c1a231044 # v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false

  bounded-rss:
    name: Bounded typed-Parquet RSS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install frozen qualification environment
        run: uv sync --frozen --all-extras
      - name: Qualify bounded conversion and partition RSS
        env:
          TOPOBENCH_QUALIFICATION_EVIDENCE_DIR: qualification-evidence
        run: uv run python test/integration/qualify_typed_graph_rss.py
      - name: Persist aggregate RSS evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typed-graph-rss-qualification
          path: qualification-evidence/typed-graph-rss-qualification.json
          if-no-files-found: error

  mandatory-cuda:
    name: Mandatory typed graph CUDA release gate
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification
    runs-on: [self-hosted, linux, x64, cuda]
    permissions:
      contents: read
    environment: release-qualification
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install frozen CUDA qualification environment
        run: uv sync --frozen --all-extras
      - name: Qualify GCN and HGT overlap, parity, and statistics
        env:
          TOPOBENCH_QUALIFICATION_EVIDENCE_DIR: qualification-evidence
        run: uv run python test/integration/qualify_typed_graph_cuda.py
      - name: Persist aggregate CUDA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typed-graph-cuda-qualification
          path: qualification-evidence/typed-graph-cuda-qualification.json
          if-no-files-found: error

  live-parquet-data:
    name: Digest-pinned live Parquet release gate
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification
    runs-on: [self-hosted, linux, x64, live-data]
    permissions:
      contents: read
    environment: release-qualification
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install frozen live-data qualification environment
        run: uv sync --frozen --all-extras
      - name: Qualify representative real multi-file Parquet sources
        env:
          TOPOBENCH_RUN_LIVE_PARQUET: "1"
          TOPOBENCH_REAL_PARQUET_GRAPH_URL: ${{ secrets.TOPOBENCH_REAL_PARQUET_GRAPH_URL }}
          TOPOBENCH_REAL_PARQUET_GRAPH_SHA256: ${{ secrets.TOPOBENCH_REAL_PARQUET_GRAPH_SHA256 }}
          TOPOBENCH_REAL_PARQUET_HETEROGENEOUS_URL: ${{ secrets.TOPOBENCH_REAL_PARQUET_HETEROGENEOUS_URL }}
          TOPOBENCH_REAL_PARQUET_HETEROGENEOUS_SHA256: ${{ secrets.TOPOBENCH_REAL_PARQUET_HETEROGENEOUS_SHA256 }}
          TOPOBENCH_QUALIFICATION_EVIDENCE_DIR: qualification-evidence
        run: uv run pytest test/integration/test_real_parquet_graph.py test/integration/test_real_parquet_heterogeneous.py test/integration/test_retained_datasets.py -q
      - name: Persist aggregate live-data evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: typed-graph-live-parquet-qualification
          path: qualification-evidence/*.json
          if-no-files-found: error
