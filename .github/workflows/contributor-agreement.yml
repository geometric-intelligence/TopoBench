name: Contributor agreement

on:
  pull_request_target:
    # Retargeting away from main must refresh other PRs sharing the old commit.
    types: [opened, reopened, closed, edited, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  verify:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    # Each surviving run reconciles every open PR, including coalesced events.
    concurrency:
      group: contributor-agreement
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code with this workflow's status token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify contributor agreement record
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/check-contributor-agreement.cjs');
            await check({ github, context, core });
